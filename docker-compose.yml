name: ecommerce

x-db-env: &db-env
  POSTGRES_HOST: ${POSTGRES_HOST:-192.168.11.220}
  POSTGRES_PORT: ${POSTGRES_PORT:-5436}
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-123}

services:
  auth-service:
    build: ./services/auth-service
    container_name: ecommerce-auth-service
    environment:
      <<: *db-env
      POSTGRES_DB: ${AUTH_DB_NAME:-ecommerce_auth}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
    expose:
      - "5001"
    networks:
      - ecommerce-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  product-service:
    build: ./services/product-service
    container_name: ecommerce-product-service
    environment:
      <<: *db-env
      POSTGRES_DB: ${PRODUCTS_DB_NAME:-ecommerce_products}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-admin-secret}
    expose:
      - "5002"
    networks:
      - ecommerce-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5002/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  order-service:
    build: ./services/order-service
    container_name: ecommerce-order-service
    environment:
      <<: *db-env
      POSTGRES_DB: ${ORDERS_DB_NAME:-ecommerce_orders}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-me-in-production}
      PRODUCT_SERVICE_URL: http://product-service:5002
    expose:
      - "5003"
    networks:
      - ecommerce-net
    restart: unless-stopped
    depends_on:
      - product-service
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5003/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    image: nginx:1.27-alpine
    container_name: ecommerce-gateway
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    networks:
      - ecommerce-net
    depends_on:
      - auth-service
      - product-service
      - order-service
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    container_name: ecommerce-frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks:
      - ecommerce-net
    depends_on:
      - gateway
    restart: unless-stopped

networks:
  ecommerce-net:
    driver: bridge
